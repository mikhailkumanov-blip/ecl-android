name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle local Cyrillic OCR models
        run: bash scripts/prepare-ocr.sh
      - name: Test, assemble and lint
        run: gradle --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: VV-Courier-PRO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks
          path: |
            core/build/reports/tests/test/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
